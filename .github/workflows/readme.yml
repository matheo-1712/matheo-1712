name: Update README

on:
  schedule:
    # Tous les jours à 04:17 UTC
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.template.md
      - scripts/build-readme.mjs
      - .github/workflows/readme.yml

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build README
        env:
          # README_TOKEN (PAT classique, scope `repo`) permet de compter aussi
          # les dépôts privés. Sinon on retombe sur le token d'Actions.
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/build-readme.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add README.md
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore(readme): refresh stats $(date -u +%Y-%m-%d)"
            git push
          fi
