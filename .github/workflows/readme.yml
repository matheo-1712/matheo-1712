name: Mise à jour du README

on:
  schedule:
    # 06:17 UTC, après la collecte du portfolio (05:17 UTC) : sans ce décalage,
    # le README republierait les projets de la veille.
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Permet au portfolio de déclencher la régénération dès qu'il a collecté
  # de nouveaux projets, au lieu d'attendre le lendemain.
  # Voir docs/notify-readme.yml.
  repository_dispatch:
    types: [projects-updated]
  push:
    branches: [main]
    paths:
      - README.template.md
      - scripts/**
      - .github/workflows/readme.yml

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Générer le README
        env:
          # README_TOKEN (PAT classique, scope `repo`) élargit les quotas de
          # l'API search. Sans lui, le jeton d'Actions suffit.
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/build-readme.mjs

      - name: Committer le README et les instantanés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ est versionné exprès : c'est le repli quand une source tombe.
          git add README.md data
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore(readme): rafraîchit les données $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
